<div class="rounded-2xl border px-4 py-3 text-sm {% if ok %}border-emerald-400/30 bg-emerald-400/10 text-emerald-100{% else %}border-rose-400/30 bg-rose-400/10 text-rose-100{% endif %}">
    {{ message }}
</div>
{% if ok and host_key_fingerprint %}
    <div class="mt-3 rounded-2xl border border-slate-800 bg-slate-950/70 px-4 py-3 text-xs text-slate-300">
        <p class="font-semibold text-slate-100">Pinned host key</p>
        <p class="mt-2">{{ host_key_algorithm }} | {{ host_key_fingerprint }}</p>
        <input type="hidden" name="host_key_algorithm" value="{{ host_key_algorithm }}">
        <input type="hidden" name="host_key_fingerprint" value="{{ host_key_fingerprint }}">
        <input type="hidden" name="verified_host" value="{{ verified_host }}">
        <input type="hidden" name="verified_ssh_port" value="{{ verified_ssh_port }}">
    </div>
{% endif %}
