<div class="rounded-3xl border border-slate-800 bg-slate-950/70 p-5">
    <h3 class="panel-title text-lg">{% if object %}Edit profile{% else %}New profile{% endif %}</h3>
    <form method="post" class="mt-4 grid gap-4 md:grid-cols-2" hx-post="{% if object %}{% url 'scanners:profile-edit' object.pk %}{% else %}{% url 'scanners:profile-create' %}{% endif %}" hx-target="#scan-profile-workspace" hx-swap="innerHTML">
        {% csrf_token %}
        {% for field in form %}
            <div class="{% if field.name == 'description' or field.name == 'include_paths' or field.name == 'exclude_paths' %}md:col-span-2{% endif %}">
                <label class="mb-2 block text-sm font-medium text-slate-200" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="mt-2 text-sm text-rose-300">{{ field.errors|join:', ' }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="md:col-span-2">
            <button type="submit" class="btn-primary">Save profile</button>
        </div>
    </form>
</div>
