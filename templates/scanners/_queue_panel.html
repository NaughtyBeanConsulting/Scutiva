<form method="post" class="space-y-4" hx-post="{% url 'scanners:queue' %}" hx-target="#scan-queue-panel" hx-swap="innerHTML">
    {% csrf_token %}
    {% for field in queue_form %}
        <div>
            <label class="mb-2 block text-sm font-medium text-slate-200" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="mt-2 text-sm text-rose-300">{{ field.errors|join:', ' }}</p>{% endif %}
        </div>
    {% endfor %}
    <button type="submit" class="btn-primary">Queue scan</button>
</form>
